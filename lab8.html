LAB – 8 ➔ Develop a React application with Login, Dashboard, and Profile modules. 

                                                         
<!DOCTYPE html>
<html>
<head>
  <title>React Application</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: Arial;
      background: #eef2f7;
      text-align: center;
      padding: 50px;
    }
    .box {
      background: white;
      padding: 25px;
      max-width: 400px;
      margin: auto;
      border-radius: 12px;
      box-shadow: 0 4px 12px #ccc;
    }
    input, button {
      padding: 10px;
      margin: 8px;
      border-radius: 5px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [user, setUser] = React.useState("");
      const [name, setName] = React.useState("");
      const [page, setPage] = React.useState("Login");

      return (
        <div className="box">
          <h2>React Application</h2>

          {!user ? (
            <>
              <h3>Login</h3>
              <input
                placeholder="Enter username"
                value={name}
                onChange={e => setName(e.target.value)}
              />
              <br />
              <button onClick={() => {
                if (name.trim()) {
                  setUser(name.trim());
                  setPage("Dashboard");
                }
              }}>Login</button>
            </>
          ) : (
            <>
              <button onClick={() => setPage("Dashboard")}>
                Dashboard
              </button>
              <button onClick={() => setPage("Profile")}>
                Profile
              </button>
              <button onClick={() => {
                setUser("");
                setName("");
                setPage("Login");
              }}>Logout</button>

              {page === "Dashboard" && (
                <h3>Welcome, {user}!</h3>
              )}
              {page === "Profile" && (
                <>
                  <h3>Profile</h3>
                  <p>Username: {user}</p>
                </>
              )}
            </>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root"))
      .render(<App />);
  </script>
</body>
</html>
